<div
  #container
  class="butterflies"
  [class.butterflies--fixed]="fixed()"
  aria-hidden="true"
>
  @for (b of resolvedSpecs(); track $index) {
    <div
      class="butterfly butterfly--{{ b.style ?? 'classic' }}"
      [style.width.px]="b.size"
      [style.height.px]="b.size"
      [style.top]="b.top"
      [style.left]="b.left ?? '0'"
      [attr.data-aos]="b.aos"
      [attr.data-aos-duration]="900"
      [attr.data-aos-delay]="b.aosDelay"
      data-aos-easing="ease-out-cubic"
    >
      <svg class="butterfly__svg" viewBox="0 0 80 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        @switch (b.style ?? 'classic') {
          @case ('delicate') {
            <path
              class="butterfly__wing butterfly__wing--l"
              d="M40 28 C30 14 14 16 16 28 C18 36 32 38 40 28Z"
            />
            <path
              class="butterfly__wing butterfly__wing--r"
              d="M40 28 C50 14 66 16 64 28 C62 36 48 38 40 28Z"
            />
          }
          @case ('elegant') {
            <path
              class="butterfly__wing butterfly__wing--l"
              d="M40 28 C24 6 6 14 10 28 C14 42 34 46 40 28Z"
            />
            <path
              class="butterfly__wing butterfly__wing--r"
              d="M40 28 C56 6 74 14 70 28 C66 42 46 46 40 28Z"
            />
          }
          @default {
            <path
              class="butterfly__wing butterfly__wing--l"
              d="M40 28 C28 8 8 12 12 28 C16 40 32 44 40 28Z"
            />
            <path
              class="butterfly__wing butterfly__wing--r"
              d="M40 28 C52 8 72 12 68 28 C64 40 48 44 40 28Z"
            />
          }
        }
        <ellipse class="butterfly__body" cx="40" cy="28" rx="1.8" ry="9" />
        <path class="butterfly__antenna" d="M38 18 Q34 10 31 8" />
        <path class="butterfly__antenna" d="M42 18 Q46 10 49 8" />
      </svg>
    </div>
  }
</div>
